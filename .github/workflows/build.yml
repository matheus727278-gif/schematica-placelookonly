name: Build modified Schematica

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (contains the patched files)
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Clone LunatriusCore source
        run: git clone https://github.com/Lunatrius/LunatriusCore.git lunatriuscore-src

      - name: Build LunatriusCore with Gradle
        working-directory: lunatriuscore-src
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Clone Schematica source
        run: git clone https://github.com/Lunatrius/Schematica.git schematica-src

      - name: Apply patched files
        run: |
          cp SchematicPrinter.java schematica-src/src/main/java/com/github/lunatrius/schematica/client/printer/SchematicPrinter.java
          cp ConfigurationHandler.java schematica-src/src/main/java/com/github/lunatrius/schematica/handler/ConfigurationHandler.java

      # The original build.gradle points at http://mc.lunatri.us/files for the
      # LunatriusCore dependency, and that server is dead (522 from Cloudflare).
      # Work around it by building LunatriusCore ourselves from source (previous
      # step) and wiring it in as a local flatDir repo instead, renamed to the
      # exact coordinate Schematica's build.gradle expects.
      #
      # Also: our LunatriusCore jar comes straight out of `gradlew build`, which
      # is already in MCP/dev-name form (not SRG-obfuscated), so using
      # `deobfCompile` on it makes ForgeGradle try to deobfuscate an
      # already-deobfuscated jar, corrupting field/method resolution (this is
      # what caused the "x/y/z has private access in Vec3i" compile errors).
      # Switch that dependency to a plain `compile` so no translation happens.
      - name: Work around dead LunatriusCore ivy repo
        run: |
          mkdir -p schematica-src/libs
          BUILT_JAR=$(ls lunatriuscore-src/build/libs/*-universal.jar | head -n1)
          echo "Built LunatriusCore jar: $BUILT_JAR"
          cp "$BUILT_JAR" schematica-src/libs/LunatriusCore-1.12.2-1.2.0.42-universal.jar

          python3 - <<'EOF'
          path = "schematica-src/build.gradle"
          with open(path) as f:
              content = f.read()

          old_repo = """repositories {
              ivy {
                  name = 'lunatrius\\' ivy repo'
                  url 'http://mc.lunatri.us/files'
              }
          }"""
          new_repo = """repositories {
              flatDir {
                  dirs 'libs'
              }
          }"""

          if old_repo not in content:
              raise SystemExit("Could not find the ivy repo block to replace - build.gradle may have changed upstream.")
          content = content.replace(old_repo, new_repo)

          old_dep = "deobfCompile group: group, name: 'LunatriusCore', version: \"${project.version_minecraft}-${project.version_lunatriuscore}\", classifier: 'universal'"
          new_dep = "compile group: group, name: 'LunatriusCore', version: \"${project.version_minecraft}-${project.version_lunatriuscore}\", classifier: 'universal'"

          if old_dep not in content:
              raise SystemExit("Could not find the LunatriusCore dependency line to replace - build.gradle may have changed upstream.")
          content = content.replace(old_dep, new_dep)

          with open(path, "w") as f:
              f.write(content)
          print("Patched build.gradle: local libs/ flatDir repo + plain compile (no deobf) for LunatriusCore.")
          EOF

      - name: Build Schematica with Gradle
        working-directory: schematica-src
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: schematica-placeLookOnly
          path: schematica-src/build/libs/*.jar
